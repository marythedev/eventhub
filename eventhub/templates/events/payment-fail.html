{% extends 'base.html' %}
{% load static %}

{% block title %} Payment Failed {% endblock %}

{% block stylesheets %}
<link rel="stylesheet" href="{% static 'css/pages/payment-result.css' %}" type="text/css">
{% endblock %}

{% block content %}

<section id="purchase" class="purchase-section">
    <div class="container-small">
        <div class="purchase-result">
            <div class="fail-icon">
                <i class="fas fa-times-circle"></i>
            </div>
            <h1>Purchase Failed</h1>
            <p class="result-message">Please try again</p>
        </div>
        <div class="confirmation-details">
            <div class="next-actions">
                <a href="{% url 'home' %}">
                    <button class="btn-primary btn-full">Go Home</button>
                </a>
                <a href="{% url 'events:view_events' %}">
                    <button class="btn-secondary btn-full">Browse Events</button>
                </a>
            </div>
        </div>
    </div>
</section>

{% endblock %}
